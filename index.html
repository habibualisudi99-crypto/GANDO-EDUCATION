<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GANDO EDUCATION V6</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f6fc;
 color:#17233d;
}
header{
 background:linear-gradient(135deg,#07152e,#123c70);
 color:white;
 padding:25px 15px;
 text-align:center;
 border-bottom:5px solid #e8b94d;
}
.logo{
 width:75px;height:75px;
 margin:auto auto 10px;
 border:3px solid #e8b94d;
 border-radius:22px;
 display:flex;align-items:center;
 justify-content:center;
 font-size:27px;font-weight:bold;
 color:#e8b94d;
 background:#10294d;
}
header h1{margin:5px;font-size:27px}
header p{margin:7px;color:#dce8fa}
nav{
 display:flex;flex-wrap:wrap;
 justify-content:center;
 gap:8px;padding:12px;
 background:#fff;
 position:sticky;top:0;z-index:5;
 box-shadow:0 3px 10px #0001;
}
button{
 border:0;border-radius:9px;
 padding:12px 16px;
 background:#123c70;color:white;
 font-weight:bold;cursor:pointer;
}
button:hover{background:#e0a82f;color:#07152e}
main{max-width:950px;margin:auto;padding:18px}
.panel{
 background:white;padding:20px;
 border-radius:15px;margin-bottom:18px;
 box-shadow:0 4px 15px #142b4b12;
}
h2{color:#123c70}
h3{color:#b17d16}
.cards{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
 gap:12px;
}
.card{
 background:#edf3fc;
 padding:18px 10px;
 text-align:center;
 border-radius:12px;
 border:1px solid #d9e4f3;
 cursor:pointer;font-weight:bold;
}
.card:hover{background:#dce9fa}
.item{
 padding:13px;margin:9px 0;
 background:#f0f5fc;border-radius:9px;
 cursor:pointer;
}
.item:hover{background:#e1ebf8}
input{
 width:100%;padding:12px;
 border:1px solid #ccd5e3;
 border-radius:8px;margin:8px 0;
}
.gold{color:#d39a27}
footer{
 background:#07152e;color:white;
 text-align:center;padding:22px;
 border-top:4px solid #e8b94d;
}
footer strong{color:#e8b94d}
a{color:#087c48;font-weight:bold}
.small{color:#65748b;font-size:13px}
</style>
</head>

<body>

<header>
 <div class="logo">GE</div>
 <h1>GANDO EDUCATION</h1>
 <p>Learn Today • Lead Tomorrow</p>
 <p class="gold"><b>QUALITY EDUCATION FOR EVERY STUDENT</b></p>
</header>

<nav>
 <button onclick="home()">HOME</button>
 <button onclick="classes()">CLASSES</button>
 <button onclick="subjects()">SUBJECTS</button>
 <button onclick="exams()">EXAMS</button>
 <button onclick="contact()">CONTACT</button>
</nav>

<main id="app"></main>

<footer>
 <p>GANDO EDUCATION V6</p>
 <p>Designed for Learning and Success</p>
 <strong>Produced By Zeko Jr</strong>
</footer>

<script>
const subjectList=[
"Mathematics","Biology","Physics","Chemistry",
"English","Kiswahili","Geography","History"
];

const topics={
Mathematics:["Numbers","Fractions","Algebra","Geometry","Statistics"],
Biology:["Introduction to Biology","Cell Structure","Nutrition","Respiration","Reproduction"],
Physics:["Introduction to Physics","Measurement","Force","Work and Energy","Light"],
Chemistry:["Introduction to Chemistry","Matter","Elements","Mixtures","Acids and Bases"],
English:["Grammar","Nouns","Pronouns","Tenses","Comprehension"],
Kiswahili:["Sarufi","Nomino","Vitenzi","Uandishi","Fasihi"],
Geography:["Introduction to Geography","Weather","Climate","Map Reading","Environment"],
History:["Introduction to History","Sources of History","Early Man","Development of Agriculture","Trade"]
};

function home(){
document.getElementById("app").innerHTML=`
<section class="panel">
<h2>Welcome to GANDO EDUCATION</h2>
<p>Your learning journey starts here. Study different subjects, read notes and practise examination questions.</p>
<div class="cards">
<div class="card" onclick="classes()">📚<br>Classes</div>
<div class="card" onclick="subjects()">📖<br>Subjects</div>
<div class="card" onclick="exams()">📝<br>Exams</div>
<div class="card" onclick="contact()">☎️<br>Contact Us</div>
</div>
</section>
<section class="panel">
<h2>Our Classes</h2>
<div class="cards">
${[1,2,3,4].map(n=>`<div class="card" onclick="showClass(${n})">FORM ${n}</div>`).join("")}
</div>
</section>
<section class="panel">
<h2>Contact Us</h2>
<p>Need help? Contact us through WhatsApp.</p>
<a href="https://wa.me/255716485776" target="_blank">WhatsApp: +255 716 485 776</a>
</section>`;
}

function classes(){
document.getElementById("app").innerHTML=`
<section class="panel">
<h2>Select Your Class</h2>
<div class="cards">
${[1,2,3,4].map(n=>`<div class="card" onclick="showClass(${n})">FORM ${n}</div>`).join("")}
</div></section>`;
}

function showClass(n){
document.getElementById("app").innerHTML=`
<section class="panel">
<h2>FORM ${n}</h2>
<p>Select a subject to continue.</p>
<div class="cards">
${subjectList.map(s=>`<div class="card" onclick="showSubject('${s}',${n})">${s}</div>`).join("")}
</div>
</section>`;
}

function subjects(){
document.getElementById("app").innerHTML=`
<section class="panel">
<h2>All Subjects</h2>
<div class="cards">
${subjectList.map(s=>`<div class="card" onclick="showSubject('${s}',1)">${s}</div>`).join("")}
</div></section>`;
}

function showSubject(s,n){
document.getElementById("app").innerHTML=`
<section class="panel">
<h2>${s} — FORM ${n}</h2>
<p>Select a topic to read its notes.</p>
${topics[s].map((t,i)=>`<div class="item" onclick="showTopic('${s}',${i},${n})">📘 ${t}</div>`).join("")}
<button onclick="showClass(${n})">Back to Subjects</button>
</section>`;
}

function showTopic(s,i,n){
let t=topics[s][i];
document.getElementById("app").innerHTML=`
<section class="panel">
<h2>${s}</h2>
<h3>${t}</h3>
<p><b>Introduction:</b> This topic introduces important concepts in ${t.toLowerCase()}.</p>
<p><b>Key points:</b></p>
<ul>
<li>Understand the meaning and basic principles of the topic.</li>
<li>Learn important terms and definitions.</li>
<li>Study examples and practise applying the concepts.</li>
<li>Revise regularly and answer questions.</li>
</ul>
<p><b>Study tip:</b> Write short notes and practise questions after every lesson.</p>
<button onclick="showSubject('${s}',${n})">Back to Topics</button>
</section>`;
}

function exams(){
document.getElementById("app").innerHTML=`
<section class="panel">
<h2>Practice Examination</h2>
<p>Answer these questions and check your score.</p>
<div id="questions"></div>
<button onclick="markExam()">SUBMIT EXAM</button>
<p id="result"></p>
</section>`;
let qs=[
["What is 5 + 7?",["10","12","15"],1],
["Which organ pumps blood?",["Heart","Lungs","Kidney"],0],
["What is the opposite of hot?",["Warm","Cold","Dry"],1],
["Which planet is known as the Red Planet?",["Earth","Mars","Venus"],1],
["Water is made up of which elements?",["Hydrogen and oxygen","Iron and carbon","Gold and silver"],0]
];
window.examQuestions=qs;
document.getElementById("questions").innerHTML=qs.map((q,i)=>`
<div class="item"><b>${i+1}. ${q[0]}</b><br>
${q[1].map((a,j)=>`<label><input style="width:auto" type="radio" name="q${i}" value="${j}">${a}</label><br>`).join("")}
</div>`).join("");
}

function markExam(){
let score=0;
window.examQuestions.forEach((q,i)=>{
let a=document.querySelector('input[name="q'+i+'"]:checked');
if(a && Number(a.value)===q[2])score++;
});
document.getElementById("result").innerHTML=
`<h3>Your Score: ${score} / ${window.examQuestions.length}</h3>`;
}

function contact(){
document.getElementById("app").innerHTML=`
<section class="panel">
<h2>Contact GANDO EDUCATION</h2>
<p>For questions and support, contact us:</p>
<p><b>WhatsApp:</b> +255 716 485 776</p>
<a href="https://wa.me/255716485776" target="_blank">
<button>CHAT WITH US ON WHATSAPP</button></a>
</section>`;
}

home();
</script>
</body>
</html>
