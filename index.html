.card:hover{background:#dce9fa;transform:translateY(-2px)}
.item{background:#f0f5fc;padding:14px;border-radius:9px;margin:9px 0;cursor:pointer}

<script>
const subjectsList=[
"Mathematics","Biology","Physics","Chemistry",
"English","Kiswahili","Geography","History"
];

const topics={
"Mathematics":["Numbers","Fractions","Decimals","Algebra","Geometry","Measurements","Statistics","Ratio and Proportion"],
"Biology":["Introduction to Biology","Cell Structure","Classification","Nutrition","Respiration","Transport","Reproduction","Ecology"],
"Physics":["Introduction to Physics","Measurement","Force","Work and Energy","Light","Heat","Sound","Electricity"],
"Chemistry":["Introduction to Chemistry","Matter","Elements","Compounds","Mixtures","Air","Water","Acids and Bases"],
"English":["Nouns","Pronouns","Verbs","Adjectives","Tenses","Prepositions","Comprehension","Composition"],
"Kiswahili":["Sarufi","Nomino","Vitenzi","Vivumishi","Vielezi","Ufahamu","Uandishi","Fasihi"],
"Geography":["Introduction to Geography","The Solar System","Weather","Climate","Map Reading","Rocks","Soil","Environment"],
"History":["Introduction to History","Sources of History","Evolution of Man","Agriculture","Trade","Technology","Colonialism","Independence"]
};

function show(html){
document.getElementById("app").innerHTML=html;
window.scrollTo(0,0);
}

function home(){
show(`
<section class="panel">
<h2>Welcome to GANDO EDUCATION 📚</h2>
<p>Your digital learning platform. Choose your class, study subjects and practise examination questions.</p>
<div class="cards">
<div class="card" onclick="classes()">📚<br>MY CLASSES</div>
<div class="card" onclick="subjects()">📖<br>SUBJECTS</div>
<div class="card" onclick="exams()">📝<br>EXAMINATION</div>
<div class="card" onclick="contact()">☎️<br>CONTACT US</div>
</div>
</section>
<section class="panel">
<h2>Choose Your Class</h2>
<div class="cards">
${[1,2,3,4].map(n=>`<div class="card" onclick="showClass(${n})">🎓<br>FORM ${n}</div>`).join("")}
</div>
</section>
<section class="panel">
<h2>Our Learning Mission</h2>
<p>To support students through learning materials, revision and practice.</p>
</section>
<section class="panel">
<h2>Contact Us</h2>
<p>WhatsApp: +255 716 485 776</p>
<a href="https://wa.me/255716485776">CHAT WITH US ON WHATSAPP</a>
</section>
`);
}

function classes(){
show(`<section class="panel"><h2>Select Your Class</h2>
<div class="cards">${[1,2,3,4].map(n=>`<div class="card" onclick="showClass(${n})">🎓<br>FORM ${n}</div>`).join("")}</div></section>`);
}

function showClass(n){
show(`<section class="panel"><h2>FORM ${n}</h2><p>Select a subject to continue.</p>
<div class="cards">${subjectsList.map(s=>`<div class="card" onclick="showSubject('${s}',${n})">📘<br>${s}</div>`).join("")}</div>
<button class="back" onclick="home()">Back Home</button></section>`);
}

function subjects(){
show(`<section class="panel"><h2>All Subjects</h2>
<div class="cards">${subjectsList.map(s=>`<div class="card" onclick="showSubject('${s}',1)">📘<br>${s}</div>`).join("")}</div></section>`);
}

function showSubject(s,n){
show(`<section class="panel"><h2>${s} — FORM ${n}</h2>
<p>Choose a topic to study.</p>
${topics[s].map((t,i)=>`<div class="item" onclick="showTopic('${s}',${i},${n})">📖 ${i+1}. ${t}</div>`).join("")}
<button class="back" onclick="showClass(${n})">Back to Subjects</button></section>`);
}

function showTopic(s,i,n){
let t=topics[s][i];
let intro={
"Mathematics":"Mathematics is the study of numbers, shapes, patterns and calculations.",
"Biology":"Biology is the scientific study of living things.",
"Physics":"Physics is the study of matter, energy and their interactions.",
"Chemistry":"Chemistry is the study of substances and how they change.",
"English":"English helps us communicate through speaking, reading and writing.",
"Kiswahili":"Kiswahili ni lugha inayotumika katika mawasiliano.",
"Geography":"Geography is the study of the Earth and its environment.",
"History":"History is the study of past human activities and events."
};
show(`<section class="panel">
<h2>${s} — FORM ${n}</h2><h3>${t}</h3>
<p><b>Introduction:</b> ${intro[s]}</p>
<p><b>Key study points:</b></p>
<ul>
<li>Understand the meaning of ${t}.</li>
<li>Learn the important terms and definitions.</li>
<li>Study examples related to the topic.</li>
<li>Write short notes and revise regularly.</li>
</ul>
<p><b>Revision activity:</b> Write five things you have learned about ${t}.</p>
<p class="small">Study material starter: add curriculum-specific explanations and examples as each topic is developed.</p>
<button class="back" onclick="showSubject('${s}',${n})">Back to Topics</button>
</section>`);
}

const questions=[
{q:"What is 5 + 7?",a:["10","12","15"],c:1},
{q:"Which organ pumps blood?",a:["Heart","Lungs","Kidney"],c:0},
{q:"Which planet is called the Red Planet?",a:["Earth","Mars","Venus"],c:1},
{q:"Water is made up of which elements?",a:["Hydrogen and oxygen","Iron and gold","Carbon and silver"],c:0},
{q:"What is the opposite of hot?",a:["Warm","Cold","Dry"],c:1},
{q:"Which gas do plants use during photosynthesis?",a:["Oxygen","Carbon dioxide","Nitrogen"],c:1},
{q:"How many days are in a week?",a:["Five","Seven","Ten"],c:1},
{q:"Which instrument measures temperature?",a:["Thermometer","Ruler","Clock"],c:0},
{q:"What is the plural of child?",a:["Childs","Children","Childes"],c:1},
{q:"Which is a source of historical information?",a:["Oral tradition","Calculator","Thermometer"],c:0}
];

function exams(){
show(`<section class="panel"><h2>Practice Examination</h2>
<p>Answer all questions, then press Submit Exam.</p>
<div id="questions"></div>
<button onclick="markExam()">SUBMIT EXAM</button>
<div id="result"></div></section>`);
document.getElementById("questions").innerHTML=questions.map((q,i)=>`
<div class="item"><b>${i+1}. ${q.q}</b><br>
${q.a.map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}">${a}</label><br>`).join("")}
</div>`).join("");
}

function markExam(){
let score=0,answered=0;
questions.forEach((q,i)=>{
let a=document.querySelector('input[name="q'+i+'"]:checked');
if(a){answered++;if(Number(a.value)===q.c)score++;}
});
document.getElementById("result").innerHTML=
`<h3>Your Score: ${score}/${questions.length}</h3><p>You answered ${answered} questions.</p><p>${score>=7?"Good work! Keep studying.":"Keep practising. You can improve!"}</p>`;
}

function contact(){
show(`<section class="panel"><h2>Contact GANDO EDUCATION</h2>
<p>For support and enquiries, contact us through WhatsApp.</p>
<h3>+255 716 485 776</h3>
<a href="https://wa.me/255716485776"><button>CHAT ON WHATSAPP</button></a>
</section>`);
}

home();
</script>
