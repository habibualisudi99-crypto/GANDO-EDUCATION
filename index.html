<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GANDO EDUCATION V3</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f5f9;color:#172554}
header{background:#123b72;color:white;padding:22px;text-align:center}
header h1{margin:0}
nav{display:flex;flex-wrap:wrap;justify-content:center;background:#09264c}
nav button{background:none;color:white;border:0;padding:14px;font-weight:bold}
main{padding:15px;max-width:850px;margin:auto}
.panel{background:white;padding:17px;margin:13px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
button,.item{cursor:pointer}
.action{background:#1265b0;color:white;border:0;padding:12px 16px;border-radius:8px;margin:5px}
.item{display:block;width:100%;text-align:left;background:#e8f1fc;border:0;padding:14px;margin:7px 0;border-radius:8px;color:#123b72;font-weight:bold}
h2{color:#12518b}
footer{text-align:center;background:#09264c;color:white;padding:18px;margin-top:30px}
.answer{display:block;margin:9px 0;padding:12px;background:#eef4fb;border-radius:8px}
</style>
</head>
<body>
<header>
<h1>GANDO EDUCATION</h1>
<p>LEARN • PRACTICE • SUCCEED</p>
</header>
<nav>
<button onclick="home()">HOME</button>
<button onclick="showSubjects()">SUBJECTS</button>
<button onclick="showExam()">EXAMS</button>
</nav>
<main id="app"></main>
<footer>Produced By Zeko Jr</footer>
<script>
const subjects={
"Mathematics":["Numbers","Fractions","Decimals","Percentages","Algebra","Geometry","Statistics","Equations"],
"Biology":["Introduction to Biology","Classification of Living Things","Cell Structure","Nutrition","Transport","Respiration","Reproduction","Ecology"],
"Physics":["Introduction to Physics","Measurement","Force","Work Energy and Power","Light","Sound","Heat","Electricity"],
"Chemistry":["Introduction to Chemistry","Laboratory Safety","Matter","Elements and Compounds","Air","Water","Acids and Bases","Chemical Reactions"],
"English":["Parts of Speech","Nouns","Pronouns","Verbs","Tenses","Adjectives","Adverbs","Writing Skills"],
"Kiswahili":["Sarufi","Nomino","Vitenzi","Vivumishi","Vielezi","Ufahamu","Insha","Fasihi"],
"Geography":["Introduction to Geography","The Solar System","Weather","Climate","Map Reading","Rocks","Soil","Environmental Conservation"],
"History":["Introduction to History","Sources of History","Evolution of Man","Early Stone Age","Development of Agriculture","Iron Technology","Trade","Colonialism"]
};
const notes={
"Numbers":"Numbers are symbols used for counting and measuring. Main types include natural numbers, whole numbers, integers, rational numbers and real numbers. Example: 5 + 3 = 8.",
"Fractions":"A fraction represents part of a whole. It has a numerator and denominator. Example: 1/2 + 1/2 = 1.",
"Decimals":"Decimals are numbers containing a decimal point. Example: 0.5 + 0.5 = 1.",
"Percentages":"Percentage means a number out of 100. Example: 25% of 200 = 50.",
"Algebra":"Algebra uses letters to represent unknown numbers. Example: x + 3 = 7, therefore x = 4.",
"Geometry":"Geometry is the study of shapes, sizes and positions. A triangle has three sides.",
"Statistics":"Statistics is the collection, organisation and interpretation of data. Mean = sum of values divided by number of values.",
"Equations":"An equation is a mathematical statement showing that two expressions are equal. Example: 2x = 10, x = 5.",
"Introduction to Biology":"Biology is the scientific study of living things. Living things grow, reproduce, respire and respond to stimuli.",
"Classification of Living Things":"Classification is grouping organisms according to their similarities and differences. It helps us identify organisms.",
"Cell Structure":"A cell is the basic unit of life. Main parts include the cell membrane, cytoplasm and nucleus.",
"Nutrition":"Nutrition is the process by which organisms obtain and use food. Plants make food through photosynthesis.",
"Transport":"Transport is the movement of substances within an organism. Plants use xylem and phloem.",
"Respiration":"Respiration releases energy from food. Aerobic respiration uses oxygen.",
"Reproduction":"Reproduction is the process by which living organisms produce offspring.",
"Ecology":"Ecology is the study of relationships between organisms and their environment.",
"Introduction to Physics":"Physics is the study of matter, energy, forces and their interactions.",
"Measurement":"Measurement is comparing a quantity with a standard unit. SI units include metre, kilogram and second.",
"Force":"Force is a push or pull that can change an object's motion or shape. Its SI unit is the newton.",
"Work Energy and Power":"Work is done when a force moves an object. Energy is the ability to do work. Power is the rate of doing work.",
"Light":"Light is a form of energy that enables us to see. It travels in straight lines in a uniform medium.",
"Sound":"Sound is produced by vibrations and travels through a medium.",
"Heat":"Heat is energy transferred because of a temperature difference.",
"Electricity":"Electricity involves electric charges. Current is measured in amperes.",
"Introduction to Chemistry":"Chemistry is the study of matter, its properties and changes.",
"Laboratory Safety":"Always follow instructions, wear protective equipment and never taste laboratory chemicals.",
"Matter":"Matter is anything that has mass and occupies space. The three common states are solid, liquid and gas.",
"Elements and Compounds":"An element contains one type of atom. A compound contains two or more elements chemically combined.",
"Air":"Air is a mixture of gases. Nitrogen and oxygen are its main components.",
"Water":"Water is a compound made of hydrogen and oxygen. Its formula is H2O.",
"Acids and Bases":"Acids have pH below 7, while bases have pH above 7. Neutral solutions have pH 7.",
"Chemical Reactions":"A chemical reaction changes reactants into new substances called products.",
"Parts of Speech":"Parts of speech are groups of words according to their functions. Examples include nouns, verbs and adjectives.",
"Nouns":"A noun is a naming word for a person, place, thing or idea. Example: teacher, school.",
"Pronouns":"A pronoun replaces a noun. Examples include he, she, it and they.",
"Verbs":"A verb expresses an action or state. Example: run, write, is.",
"Tenses":"Tenses show the time of an action. Main forms include present, past and future.",
"Adjectives":"An adjective describes a noun. Example: a beautiful flower.",
"Adverbs":"An adverb describes a verb, adjective or another adverb. Example: She runs quickly.",
"Writing Skills":"Good writing uses clear sentences, correct grammar, punctuation and organised paragraphs.",
"Sarufi":"Sarufi ni kanuni zinazotawala matumizi sahihi ya lugha. Husaidia kujenga sentensi sahihi.",
"Nomino":"Nomino ni maneno yanayotaja watu, vitu, mahali au hali. Mfano: mtoto, shule.",
"Vitenzi":"Vitenzi ni maneno yanayoonyesha tendo au hali. Mfano: kula, soma, lala.",
"Vivumishi":"Vivumishi ni maneno yanayoeleza sifa za nomino. Mfano: mtoto mzuri.",
"Vielezi":"Vielezi hufafanua zaidi tendo au hali. Mfano: anakimbia haraka.",
"Ufahamu":"Ufahamu ni uwezo wa kusoma habari na kuelewa ujumbe wake.",
"Insha":"Insha ni maandishi yanayowasilisha mawazo kuhusu mada fulani.",
"Fasihi":"Fasihi ni sanaa ya lugha inayotumia maneno kueleza maisha ya jamii.",
"Introduction to Geography":"Geography is the study of the Earth, its features, people and environment.",
"The Solar System":"The solar system consists of the Sun and objects that orbit it, including eight planets.",
"Weather":"Weather is the condition of the atmosphere at a particular place and time.",
"Climate":"Climate is the average weather condition of a place over a long period.",
"Map Reading":"A map is a representation of an area on a flat surface. It uses symbols and a scale.",
"Rocks":"Rocks are natural solid materials forming part of the Earth's crust.",
"Soil":"Soil is the upper layer of the Earth that supports plant growth.",
"Environmental Conservation":"Environmental conservation means protecting natural resources and reducing pollution.",
"Introduction to History":"History is the study of past human activities and events.",
"Sources of History":"Sources of history include oral traditions, written records, archaeology and archives.",
"Evolution of Man":"Human evolution describes changes in human ancestors over millions of years.",
"Early Stone Age":"The Early Stone Age is the earliest period of human tool-making, when people mainly used simple stone tools.",
"Development of Agriculture":"Agriculture is the growing of crops and keeping of animals for food and other products.",
"Iron Technology":"Iron technology involved making tools and weapons from iron, improving farming and production.",
"Trade":"Trade is the exchange of goods and services between people or communities.",
"Colonialism":"Colonialism is the control of one territory by another power for political and economic purposes."
};
let currentClass="Form I";
let currentSubject="";
function home(){
document.getElementById("app").innerHTML=`
<div class="panel"><h2>Welcome to GANDO EDUCATION</h2>
<p>Choose your class and study your subjects.</p>
${["Form I","Form II","Form III","Form IV"].map(c=>`<button class="action" onclick="chooseClass('${c}')">${c}</button>`).join("")}
</div>
<div class="panel"><h2>Learning features</h2><p>Study notes • Topic lists • Practice exams • Instant results</p></div>`;
}
function chooseClass(c){currentClass=c;showSubjects()}
function showSubjects(){
document.getElementById("app").innerHTML=`
<div class="panel"><h2>${currentClass} Subjects</h2>
${Object.keys(subjects).map(s=>`<button class="item" onclick="showTopics('${s}')">${s}</button>`).join("")}
<button class="action" onclick="home()">Back</button></div>`;
}
function showTopics(s){
currentSubject=s;
document.getElementById("app").innerHTML=`
<div class="panel"><h2>${s} - ${currentClass}</h2>
<p>Select a topic to study:</p>
${subjects[s].map(t=>`<button class="item" onclick="showNote('${t}')">${t}</button>`).join("")}
<button class="action" onclick="showSubjects()">Back</button></div>`;
}
function showNote(t){
document.getElementById("app").innerHTML=`
<div class="panel"><h2>${t}</h2>
<p>${notes[t]||"This topic is part of the "+currentSubject+" syllabus. Study its definition, main concepts, examples and applications. Consult your class textbook for the full topic details."}</p>
<h3>Revision points</h3>
<ul><li>Understand the meaning of the topic.</li><li>Learn the main facts and definitions.</li><li>Study examples and practise questions.</li></ul>
<button class="action" onclick="showTopics('${currentSubject}')">Back to Topics</button></div>`;
}
const questions=[
{q:"What is Biology?",a:["Study of living things","Study of numbers","Study of rocks"],c:0},
{q:"What is the SI unit of force?",a:["Metre","Newton","Kilogram"],c:1},
{q:"What is the formula of water?",a:["CO2","O2","H2O"],c:2},
{q:"What is 25% of 200?",a:["25","50","75"],c:1},
{q:"Which word is a noun?",a:["Run","Beautiful","Teacher"],c:2},
{q:"Weather refers to atmospheric conditions over:",a:["A short time","Thirty years only","A century"],c:0},
{q:"History studies:",a:["Future events","Past human activities","Only animals"],c:1},
{q:"A cell is the basic unit of:",a:["Life","Weather","Rocks"],c:0}
];
function showExam(){
document.getElementById("app").innerHTML=`
<div class="panel"><h2>${currentClass} - Practice Exam</h2>
<p>Answer all questions then submit to see your score.</p>
<form id="quiz">
${questions.map((q,i)=>`<div class="panel"><b>${i+1}. ${q.q}</b>${q.a.map((a,j)=>`<label class="answer"><input type="radio" name="q${i}" value="${j}"> ${a}</label>`).join("")}</div>`).join("")}
<button class="action" type="submit">SUBMIT EXAM</button>
</form><div id="result"></div></div>`;
document.getElementById("quiz").onsubmit=function(e){
e.preventDefault();let score=0;
questions.forEach((q,i)=>{let v=document.querySelector('input[name="q'+i+'"]:checked');if(v&&Number(v.value)===q.c)score++});
document.getElementById("result").innerHTML=`<h2>Your score: ${score}/${questions.length}</h2><p>${score>=5?"Good work! Keep studying.":"Keep practising. You can improve!"}</p><button class="action" onclick="showExam()">Try Again</button>`;
};
}
home();
</script>
</body>
</html>
