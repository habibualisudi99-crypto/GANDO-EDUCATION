const explanations={
"Numbers":"Numbers are symbols used for counting and measuring. Types include natural numbers, whole numbers, integers and rational numbers. Example: 12 + 8 = 20.",
"Fractions":"A fraction represents part of a whole. It has a numerator and denominator. Example: 1/2 + 1/2 = 1.",
"Decimals":"Decimals are numbers written using a decimal point. Example: 0.5 + 0.25 = 0.75.",
"Percentages":"Percentage means a number out of one hundred. Example: 20% of 100 = 20.",
"Algebra":"Algebra uses letters to represent unknown numbers. Example: x + 5 = 9, therefore x = 4.",
"Geometry":"Geometry is the study of shapes, sizes and positions. A triangle has three sides.",
"Statistics":"Statistics involves collecting, organising and interpreting data. Mean = total of values divided by number of values.",
"Equations":"An equation is a mathematical statement showing equality. Example: 2x = 10, so x = 5.",
"Introduction to Biology":"Biology is the scientific study of living organisms. Living things grow, reproduce, respire and respond to stimuli.",
"Classification":"Classification is grouping organisms according to similarities and differences. It makes identification easier.",
"Cell Structure":"A cell is the basic structural and functional unit of life. Main parts include the cell membrane, cytoplasm and nucleus.",
"Nutrition":"Nutrition is the process by which organisms obtain and use food. Green plants make food through photosynthesis.",
"Transport":"Transport is the movement of substances within an organism. In plants, xylem transports water while phloem transports food.",
"Respiration":"Respiration is the process of releasing energy from food. Aerobic respiration uses oxygen.",
"Reproduction":"Reproduction is the process by which living organisms produce new individuals of their own kind.",
"Ecology":"Ecology is the study of relationships between organisms and their environment.",
"Introduction to Physics":"Physics is the study of matter, energy, forces and their interactions.",
"Measurement":"Measurement is comparing a quantity with a standard unit. SI units include metre, kilogram and second.",
"Force":"Force is a push or pull that can change an object's motion or shape. Its SI unit is newton.",
"Work Energy and Power":"Work is done when a force moves an object. Energy is the ability to do work. Power is the rate of doing work.",
"Light":"Light is a form of energy that enables us to see. It travels in straight lines in a uniform medium.",
"Sound":"Sound is produced by vibrations and travels through a medium.",
"Heat":"Heat is energy transferred from a hotter body to a colder body because of temperature difference.",
"Electricity":"Electricity involves electric charges. Electric current is measured in amperes.",
"Introduction to Chemistry":"Chemistry is the study of matter, its properties, composition and changes.",
"Laboratory Safety":"Follow instructions, wear protective equipment and never taste laboratory chemicals.",
"Matter":"Matter is anything that has mass and occupies space. Common states are solid, liquid and gas.",
"Elements and Compounds":"An element contains one type of atom. A compound contains two or more elements chemically combined.",
"Air":"Air is a mixture of gases. Nitrogen and oxygen are its main components.",
"Water":"Water is a compound made of hydrogen and oxygen. Its chemical formula is H2O.",
"Acids and Bases":"Acids have pH below 7, bases have pH above 7, while neutral solutions have pH 7.",
"Chemical Reactions":"A chemical reaction changes reactants into new substances called products.",
"Parts of Speech":"Parts of speech are groups of words according to their functions. Examples include nouns, verbs and adjectives.",
"Nouns":"A noun is a naming word for a person, place, thing or idea. Examples: teacher, school and book.",
"Pronouns":"A pronoun replaces a noun. Examples include he, she, it, we and they.",
"Verbs":"A verb expresses an action or state. Examples: run, write, eat and sleep.",
"Tenses":"Tenses show the time of an action. Main forms include present, past and future.",
"Adjectives":"An adjective describes a noun. Example: She has a beautiful dress.",
"Adverbs":"An adverb describes a verb, adjective or another adverb. Example: She runs quickly.",
"Writing Skills":"Good writing uses clear sentences, correct grammar, punctuation and organised paragraphs.",
"Sarufi":"Sarufi ni kanuni zinazotawala matumizi sahihi ya lugha. Husaidia kujenga sentensi sahihi.",
"Nomino":"Nomino ni maneno yanayotaja watu, vitu, mahali au hali. Mfano: mtoto, shule na kalamu.",
"Vitenzi":"Vitenzi ni maneno yanayoonyesha tendo au hali. Mfano: kula, soma na lala.",
"Vivumishi":"Vivumishi ni maneno yanayoeleza sifa za nomino. Mfano: mtoto mzuri.",
"Vielezi":"Vielezi hufafanua zaidi tendo au hali. Mfano: anakimbia haraka.",
"Ufahamu":"Ufahamu ni uwezo wa kusoma habari na kuelewa ujumbe wake.",
"Insha":"Insha ni maandishi yanayowasilisha mawazo kuhusu mada fulani.",
"Fasihi":"Fasihi ni sanaa ya lugha inayotumia maneno kueleza maisha ya jamii.",
"Introduction to Geography":"Geography is the study of the Earth, its features, people and environment.",
"The Solar System":"The solar system consists of the Sun and objects that orbit it, including eight planets.",
"Weather":"Weather is the condition of the atmosphere at a particular place and time.",
"Climate":"Climate is the average weather condition of a place over a long period.",
"Map Reading":"A map is a representation of an area on a flat surface. It uses symbols, direction and scale.",
"Rocks":"Rocks are natural solid materials that form part of the Earth's crust.",
"Soil":"Soil is the upper layer of the Earth that supports plant growth.",
"Environmental Conservation":"Environmental conservation means protecting natural resources and reducing pollution.",
"Introduction to History":"History is the study of past human activities and events.",
"Sources of History":"Sources of history include oral traditions, written records, archaeology and archives.",
"Evolution of Man":"Human evolution describes changes in human ancestors over millions of years.",
"Early Stone Age":"The Early Stone Age is the earliest period of human tool-making, when people mainly used simple stone tools.",
"Development of Agriculture":"Agriculture is the growing of crops and keeping of animals for food and other products.",
"Iron Technology":"Iron technology involved making tools and weapons from iron, improving farming and production.",
"Trade":"Trade is the exchange of goods and services between people or communities.",
"Colonialism":"Colonialism is the control of one territory by another power for political and economic purposes."
};

const questions=[
{q:"What is Biology?",a:["Study of living things","Study of numbers","Study of rocks"],c:0},
{q:"What is the SI unit of force?",a:["Metre","Newton","Kilogram"],c:1},
{q:"What is the chemical formula of water?",a:["CO2","O2","H2O"],c:2},

function classes(){
document.getElementById("app").innerHTML=`<div class="panel"><h2>Select Your Class</h2>
${["Form I","Form II","Form III","Form IV"].map(c=>`<button class="item" onclick="selectClass('${c}')">${c}</button>`).join("")}</div>`;

function selectClass(c){selectedClass=c;subjects()}
function subjects(){
document.getElementById("app").innerHTML=`<div class="panel"><h2>${selectedClass} - Subjects</h2>
${Object.keys(curriculum).map(s=>`<button class="item" onclick="topics('${s}')">${s}</button>`).join("")}
<button class="action" onclick="classes()">Back</button></div>`;
}
function topics(s){
selectedSubject=s;
document.getElementById("app").innerHTML=`<div class="panel"><h2>${s} - ${selectedClass}</h2>
<p>Select a topic:</p>
${curriculum[s].map(t=>`<button class="item" onclick="note('${t}')">${t}</button>`).join("")}
<button class="action" onclick="subjects()">Back</button></div>`;
}
function note(t){
let explanation=explanations[t]||`${t} is an important topic in ${selectedSubject}. Study its meaning, main principles, characteristics, examples and applications. Use your class textbook and teacher's guidance to develop a deeper understanding.`;
document.getElementById("app").innerHTML=`<div class="panel">
<h2>${t}</h2><p>${explanation}</p>
<h3>Revision Points</h3>
<ul><li>Understand the definition of the topic.</li>
<li>Learn the important facts and principles.</li>
<li>Study examples and applications.</li>
<li>Practise questions to test your understanding.</li></ul>
<h3>Practice Question</h3>
<p>Explain the meaning of ${t} and give two important points about it.</p>
<button class="action" onclick="topics('${selectedSubject}')">Back to Topics</button>
</div>`;
}
function exam(){
document.getElementById("app").innerHTML=`<div class="panel"><h2>${selectedClass} - Practice Examination</h2>
<p>Answer all questions and submit to see your score.</p>
<form id="quiz">
${questions.map((q,i)=>`<div class="panel"><b>${i+1}. ${q.q}</b>
${q.a.map((a,j)=>`<label class="answer"><input type="radio" name="q${i}" value="${j}">${a}</label>`).join("")}</div>`).join("")}
<button class="action" type="submit">SUBMIT EXAM</button>
</form><div id="result"></div></div>`;
document.getElementById("quiz").onsubmit=function(e){
e.preventDefault();let score=0;
questions.forEach((q,i)=>{
let answer=document.querySelector('input[name="q'+i+'"]:checked');
if(answer&&Number(answer.value)===q.c)score++;
});
document.getElementById("result").innerHTML=`<div class="panel"><h2>Exam Results</h2><h1>${score}/${questions.length}</h1><p>Percentage: ${score*10}%</p><p>${score>=7?"Excellent work! Keep it up.":"Keep practising. You can improve!"}</p><button class="action" onclick="exam()">TRY AGAIN</button></div>`;
};
}
